  - '&b&l┃  &6/%command% confirm [Grund] &8- &fBestätige, dass der Spieler Cheats hat.'
  - '&b&l┃  &6/%command% stopall &8- &fBeende die Überprüfung für alle Spieler.'
  - '&b&l┃  &6/%command% timer continue &8- &fStarte den Timer für einen Spieler (während
    der Überprüfung).'
  - '&b&l┃  &6/%command% timer stop &8- &fBeende den Timer für einen Spieler (während
    der Überprüfung).'
  - '&b&l┃  &6/%command% timer add [Zeit] &8- &fVerlängere den Timer für einen Spieler
    (während der Überprüfung).'
  - '&b&l┃  &6/%command% timer set [Zeit] &8- &fStellt die Zeit für den Spieler ein.'
  - '&b&l┃  &6/%command% offline --remove &8- &fEntfernt den Spieler von der Offline-Prüfung.'
  - '&b&l┃  &6/%command% offline --info &8- &fZeigt den Spieler, der sich zurzeit in
    der Offline-Prüfung befindet.'
  - '&b&l┃  &6/%command% offline --start [Nickname] &8- &fRufe einen Spieler zur Offline-Überprüfung
    auf.'
  - '&b&l┃  &6/%command% version &8- &fÜberprüfe die neue Version des Plugins.'
  - '&b&l┃  &6/%command% info [Name] &8- &fSpielerinformationen anzeigen.'
  - '&b&l┃  &6/%command% knockback [Name] &8- &fÜberprüfen Sie den Spieler auf Anti-Knockback.'
  - '&b&l┃  &6/%command% spec [Name] &8- &fÜberwachung des Spielers.'
  - '&b&l┃  &6/%command% brand [spieler] &8- &fClient-Brand des Spielers anzeigen.'
  - '&b&l┃  &6/%command% troll &8- &fBefehle zum Trollin.'
