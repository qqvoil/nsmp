# Nachrichten für den Befehl /scheck
Command-Arg-Usage-Messages:
  Usage:
  - '&b&l┏'
  - '&b&l┃ &dPlugin-Befehle:'
  - '&b&l┃  &6/%command% start [Name] &8- &fStarte die Überprüfung eines Spielers.'
  - '&b&l┃  &6/%command% stop &8- &fBeende die Überprüfung eines Spielers (während der
    Überprüfung).'
  - '&b&l┃  &6/%command% confess &8- &fGeständnisse über Cheats (während der Überprüfung).'
  - '&b&l┃  &6/%command% reload &8- &fLade alle Dateien neu.'
