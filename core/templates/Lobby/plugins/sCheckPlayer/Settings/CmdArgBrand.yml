#

# Setting up the /scheck brand command (View the player's client brand.).
# Настройка команды /scheck brand (Просмотр бренда клиента игрока.)
Command-Arg-Brand:
  # You can disable the "brand" command argument
  # by setting the value to false, and to enable it - true.
  # Вы можете отключить аргумент команды "brand"
  # Установив значения false, а чтобы включить - true
  Command-Arg-Brand-Enabled: true
  WhiteList-Players:
    # Should I include a whitelist of players that cannot be checked for anti-kickbacks?
    # Нужно ли включать белый список игроков, которых нельзя проверить на анти-откидывания?
    Enabled: false
    # Specify a list of players.
    # Укажите список игроков.
    Players:
    - Snon_SS
