#

# Setting up the /scheck offline --start command (Вызвать игрока на оффлайн проверку.)
# Настройка команды /scheck offline --start (Challenge a player for offline verification.)
Command-Arg-Offline-Start:
  # You can disable the "--start" command argument
  # by setting the value to false, and to enable it - true.
  # Вы можете отключить аргумент команды "--start"
  # Установив значения false, а чтобы включить - true
  Command-Arg-Offline-Start-Enabled: true
  Player-Never-Joined:
    # Determines whether to check if the player has ever been on the server.
    # When using the command /scheck offline --start [nick]:
    # - If true, it will check if the player has been registered on the server.
    # - If false, the check is ignored, and the command executes regardless of this.
    #
    # Определяет, должна ли проверяться информация о том, был ли игрок когда-либо на сервере.
    # При использовании команды /scheck offline --start [ник]:
    # - Если true, будет проверяться, был ли игрок зарегистрирован на сервере.
    # - Если false, проверка игнорируется и команда выполняется независимо от этого.
    Enabled: true
  WhiteList-Players:
    # Should I include a whitelist of players who cannot be called for review?
    # Нужно ли включать белый список игроков, которых нельзя вызвать на проверку?
    Enabled: false
    # Specify a list of players.
    # Укажите список игроков.
    Players:
    - Snon_SS
