#

Check-Proximity:
  # Enable/disable proximity check to prevent other players from
  # approaching a player on check.
  # !!! Check does not work if Player-Move-Enabled in Listeners.yml = true. !!!
  # Включение/выключение проверки близости, чтобы другие игроки не смогли
  # подойти к игроку на проверке.
  # !!! Проверка не работает, если Player-Move-Enabled в Listeners.yml = true. !!!
  Enabled: true
  # Радиус проверки близости (в блоках).
  # Игроки в пределах этого радиуса будут проверяться.
  Proximity-Radius: 10
  # Vertical movement speed (Y axis).
  # Скорость вертикального перемещения (ось Y).
  Velocity-Y: 0.3
  # Speed multiplication factor.
  # Коэффициент умножения скорости перемещения.
  Velocity-Multiply: 0.3
  # Task execution interval (in milliseconds).
  # Интервал выполнения задачи (в миллисекундах).
  Task-Interval: 1
  # Message sending interval (in seconds).
  # Интервал отправки сообщений (в секундах).
  Message-Interval: 5
  # Enable/disable message sending.
  # Включение/выключение отправки сообщения.
  Proximity-Message: true
  # A list of allowed players who can approach the player during the check.
  # Players listed here will not be affected by the Proximity Check.
  # The username must be specified exactly, including the correct letter case.
  # If a player is not listed here and the Proximity Check is enabled, they will not be able to approach.
  # Список разрешенных игроков, которым можно приблизиться к игроку во время проверки.
  # Игроки, указанные в этом списке, не будут затронуты проверкой близости (Proximity Check).
  # Имя пользователя должно быть указано точно, включая правильный регистр букв.
  # Если игрок не указан в этом списке, и Proximity Check включен, он не сможет приблизиться.
  Allowed-Players:
  - Snon_SS
