#

# Setting up the /scheck start command (initiate player inspection).
# Настройка команды /scheck start (начать проверку игрока)
Command-Arg-Start:
  # You can disable the "start" command argument
  # by setting the value to false, and to enable it - true.
  # Вы можете отключить аргумент команды "start"
  # Установив значения false, а чтобы включить - true
  Command-Arg-Start-Enabled: true
  # You can disable the "scheck afk" command argument
  # by setting the value to false, and to enable it - true.
  # Вы можете отключить аргумент команды "scheck afk"
  # Установив значения false, а чтобы включить - true
  Command-Arg-Afk-Remove-Enabled: true
  Time:
    # Inspection duration (in seconds) (900 seconds = 15 minutes)
    # Длительность проверки (в секундах) (900 секунд = 15 минут)
    Check-Time: 900
    # Player verification is automatically stopped if the
    # initiator has left the server and has not returned within this time.
    # Проверка игрока автоматически останавливается,
    # если инициатор вышел с сервера и не вернулся, за это время.
    Check-Player-Stop-Initiator-Not-Time-Online-Enabled: true
    # The time (in seconds) after which the player check is automatically stopped,
    # if the initiator has left the server and has not returned within this time.
    # Время (в секундах), через которое проверка игрока автоматически останавливается,
    # если инициатор вышел с сервера и не вернулся, за это время.
    Check-Player-Stop-Initiator-Not-Time-Online: 180
  Inventory-Hide:
    # Enables or disables hiding the player's inventory when starting a scan. After a successful check, the inventory is restored.
    # Включает или отключает скрытие инвентаря игрока при начале проверки. После успешной проверки инвентарь восстанавливается.
    Enabled: true
  Freeze-All-Players-IP:
    # Enables or disables checking all online players for matching IP addresses with the player being checked.
    # If an IP match is found, other accounts will be prohibited from moving until the check is complete.
    # !!! It may work incorrectly, but if there are no issues, you can leave it on without changes!!!
    # Включает или отключает проверку всех онлайн игроков на совпадение IP с игроком, вызванным на проверку.
    # Если IP совпадает, то другим аккаунтам будет запрещено перемещаться до завершения проверки.
    # !!! Может работать некорректно, но если проблем не возникает, можете оставить включённым без изменений. !!!
    Enabled: true
  Hits-ArmorStand-TargetPlayer:
    # Enables or disables the KillAura check: if a player under
    # inspection hits an armor stand, they will be banned.
    # Включает или отключает проверку на киллауру: если игрок, вызванный
    # на проверку, ударит стойку брони, он будет забанен.
    Enabled: true
    # Starting rotation angle
    # Начальный угол поворота
    Initial-Angle: 0.0
    # Distance from the player (radius)
    # Расстояние от игрока (радиус)
    Base-Radius: 2.0
    # Maximum vertical bounce offset
    # Максимальное отклонение по вертикали
    Max-Height-Offset: 0.7
    # Base height (1.2 = head level)
    # Базовая высота (на уровне головы)
    Vertical-Base: 1.2
    # PI divisor for step (Math.PI / 6)
    # Делитель для PI (Math.PI / 6)
    Angle-Step-Divider: 6.0
    # PI divisor for angle randomness (Math.PI / 12)
    # Делитель рандома угла (Math.PI / 12)
    Angle-Random-Divider: 12.0
    # Radius fluctuation scale
    # Разброс радиуса (0.5)
    Radius-Random-Scale: 0.5
    # Random centering constant (0.5)
    # Число для центровки рандома (обычно 0.5)
    Math-Offset: 0.5
    # Height range multiplier (2.0)
    # Множитель для диапазона высоты (обычно 2.0)
    Math-Multiplier: 2.0
    # Height range subtrahend (1.0)
    # Вычитаемое для диапазона высоты (обычно 1.0)
    Math-Subtrahend: 1.0
    # Initial vertical height when the armor stand is first spawned
    # Начальная высота спавна стойки (относительно игрока)
    Spawn-Y-Offset: 3.0
    # Total effect duration in ticks (200 ticks = 10 seconds)
    # Длительность работы стойки перед исчезновением (в тиках)
    # 200 тиков = 10 секунд
    Duration-Ticks: 200
    # Rotation speed of the armor stand in ticks (20 ticks = 1 second)
    # Lower values make the armor stand rotate faster.
    # Скорость вращения стойки в тиках (20 тиков = 1 секунда)
    # Чем меньше число, тем быстрее летает стойка.
    Armor-Stand-Rotate-Interval: 10
    # List of properties for the ArmorStand
    # You can use any method from: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/ArmorStand.html
    # Список параметров для стойки
    # Список методов: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/ArmorStand.html
    Properties:
    - setAI false
    - setSilent true
    - setGravity false
    - setArms false
  Clickable-Messages-Tags:
    # Enables or disables clickable fragments in text.
    # For example, writing something like !example! in a message will make "example" clickable.
    # Example: "Hello, click !here! to copy/paste" — the word "here" will be clickable.
    # Включает или отключает обработку кликабельных фрагментов в тексте.
    # Если вы напишете в сообщении что-то вроде !пример!, то этот текст станет кликабельным.
    # Например: "Привет, нажми !сюда! чтобы скопировать/вставить" — слово "сюда".
    # Clickable message processing mode:
    # - OFF (or false) - disabled
    # - MANUAL - only processes messages with !tags!
    # Режим обработки кликабельных сообщений:
    # - OFF (или false) — отключено
    # - MANUAL — обрабатываются только !теги!
    Mode: MANUAL
    Manual:
      # The symbol used to mark clickable text.
      # By default, an exclamation mark (!) is used, so text between two such symbols will be clickable.
      # Example: !click here!
      # Символ, который используется для выделения кликабельного текста.
      # По умолчанию используется восклицательный знак (!), то есть текст
      # между двумя такими знаками станет кликабельным.
      # Например: !кликни сюда!
      Symbol: '!'
      # The color used for the clickable text.
      # If left empty (Color: ''), the color from the previous text will be inherited.
      # Supports standard color codes (&a, &6, etc.) and RGB (e.g., &#ffaa00 for servers 1.16+).
      # Цвет, которым будет отображаться кликабельный текст.
      # Если оставить пустым (Color: ''), то цвет будет таким же, как и у остального текста до тега.
      # Поддерживаются стандартные коды (&a, &6 и т.д.), а также RGB (например, &#ffaa00, если сервер 1.16+).
      Color: '&b'
      # Enables or disables the tooltip when the player
      # hovers over the clickable part.
      # Включает или отключает появление подсказки, когда
      # игрок наводит курсор на кликабельную часть.
      Hover-Enabled: true
      # Enables or disables click actions for the tag.
      # Включает или отключает реакцию на клик по тегу.
      Click-Action-Enabled: true
      # Defines the action when the tag is clicked:
      #  COPY-TEXT — copies the text to the player's clipboard.
      #  PASTE-TEXT — pastes the text into the player's chat input field.
      # Что происходит при клике по тегу:
      #  COPY-TEXT — копирует текст внутрь буфера обмена игрока.
      #  PASTE-TEXT — вставляет текст в строку чата игрока.
      Click-Action: COPY-TEXT
      # Whether to remove the symbol (e.g., !) around the tag in the visible message.
      # If true — the player will see only the inner text, e.g., "example".
      # If false — the tag will appear as "!example!".
      # Удалять ли символы (например, !) вокруг тега при отображении.
      # Если true — игрок увидит просто текст без символов, например "пример".
      # Если false — тег будет отображаться как "!пример!".
      Remove-Symbol-In-Text: false
      Display-Click-Text:
        # Enables or disables the display of additional text next to the tag.
        # If enabled (true), a label from the language file will be added near the tag.
        # Включает или отключает показ дополнительного текста рядом с тегом.
        # Если включено (true), то рядом с тегом будет добавлен текст из файлов локализации.
        Enabled: true
        # Position of the additional click label.
        # Available values:
        #  LEFT — the label will appear before the tag, e.g., "(CLICK) message"
        #  RIGHT — the label will appear after the tag, e.g., "message (CLICK)"
        #  NONE — no additional label will be shown.
        # Расположение дополнительного текста.
        # Возможные значения:
        #  LEFT — текст будет стоять перед значением, пример: "(КЛИК) сообщения"
        #  RIGHT — текст будет после значения, пример: "сообщения (КЛИК)"
        #  NONE — дополнительный текст не будет добавляться.
        Position: RIGHT
  Teleport:
    # Allow teleporting the target player to the executor?
    # Разрешить телепортацию целевого игрока к инициатору проверки?
    Allow-Teleport-To-Executor: false
    # Enables or disables teleportation of the player to the initiator at a distance.
    # For this to work, you need to disable Allow-Teleport-To-Executor: false
    # Включает или отключает телепортацию игрока к инициатору на расстоянии.
    # Чтобы это работало нужно отключить Allow-Teleport-To-Executor: false
    Allow-Teleport-To-Executor-At-Distance: true
    # The distance in blocks the player will be teleported from the initiator.
    # Расстояние в блоках, на которое будет телепортирован игрок от инициатора.
    Distance: 3
    # Enables or disables teleportation of players back to their original location,
    # after disabling the plugin.
    # Включает или отключает телепортацю игроков обратно на исходное местоположение,
    # после отключения плагина.
    Allow-Teleport-Back-Players-Disabled-Plugin: true
    # Enables or disables safe teleportation of the player to the initiator at a distance.
    # If the player is inside blocks, they will be teleported to the highest block.
    # Включает или отключает безопасную телепортацию игрока к инициатору на расстоянии.
    # Если игрок находится в блоках, он будет телепортирован на самый верхний блок.
    # Works only when enabled: Allow-Teleport-To-Executor-At-Distance: true
    # Работает только когда включено: Allow-Teleport-To-Executor-At-Distance: true
    Safe-Teleport-Enabled: true
    # Allow teleporting the target player back to their original location
    # After the time is up.
    # Разрешить телепортацию целевого игрока обратно на исходное местоположение
    # После окончании времени.
    Allow-Teleport-Time-Out-Back-Target-Player: true
  Teleport-Target-Player-Custom-Location:
    # Enables or disables player teleportation to other coordinates at the start of the check.
    # (To make this work, Allow-Teleport-To-Executor: false must be disabled)
    # Включает или отключает телепортацию игрока на другие координаты при начале проверки.
    # (Чтобы это работало, нужно отключить Allow-Teleport-To-Executor: false)
    Enabled: false
    # The name of the world to which the player will be teleported.
    # Название мира, куда будет телепортирован игрок.
    World: world
    # Teleport coordinates.
    # Координаты телепортации.
    X: 0
    Y: 0
    Z: 0
    # The yaw (horizontal rotation) and pitch (vertical rotation) angles.
    # Угол поворота по горизонтали (yaw) и вертикали (pitch).
    Yaw: 0.0
    Pitch: 0.0
  ActionBar:
    # Enables or disables the Action Bar for the player at the start of the check.
    # Включает или отключает Экшен-Бар игроку при начале проверки.
    ActionBar-Player: true
    # Enables or disables the Action Bar for the initiator at the start of the check.
    # Включает или отключает Экшен-Бар инициатору при начале проверки.
    ActionBar-Initiator: true
  Chat:
    # Should the player's chat be enabled at the start of the inspection?
    # Нужно ли включать чат игроку при начале проверки?
    Chat-No-Repeat-Enabled: true
    # Do I need to enable repeatable chat for the player when checking?
    # Нужно ли включать повторяемый чат игроку когда идет проверка?
    Chat-Repeat-Enabled: true
    # Message sent to the player every 20 seconds, notifying them that they are being inspected.
    # Каждые 20 секунд, будет писаться сообщение игроку о том, что он вызван на проверку.
    Message-Delay: 20
    #
    # Does the initiator need to clear the chat when starting the check?
    # Нужно ли очищать чат инициатору при начале проверки?
    Clear-Chat-Initiator-Player-Enabled: false
    # After how many milliseconds the message should be shown to the initiator,
    # indicating that they have called a player for a check after the chat has been cleared.
    # Works only when Clear-Chat-Initiator-Player-Enabled: true is enabled.
    # Через сколько (миллисекунд) должно быть показано инициатору сообщения,
    # что он вызвал игрока на проверку после очистки чата.
    # Работает только когда включено Clear-Chat-Initiator-Player-Enabled: true
    Message-Appears-Initiator: 3
    # The number of blank lines sent to the chat for the initiator.
    # Количество пустых строк, отправляемых в чат для инициатора.
    Chat-Clear-Lines-Initiator: 150
    #
    # Does the player need to clear the chat when starting a check?
    # Нужно ли очищать чат игроку при начале проверки?
    Clear-Chat-Target-Player-Enabled: false
    # After how many milliseconds the message should be shown to the player,
    # indicating that they have been called for a check after the chat has been cleared.
    # Works only when Clear-Chat-Target-Player-Enabled: true is enabled.
    # Через сколько (миллисекунд) должно быть показано игроку сообщения,
    # что его вызвали на проверку после очистки чата.
    # Работает только когда включено Clear-Chat-Target-Player-Enabled: true
    Message-Appears-Target: 3
    # The number of blank lines sent to the player's chat.
    # Количество пустых строк, отправляемых в чат для игрока.
    Chat-Clear-Lines-Target: 150
  BossBar-Player-Quit-Initiator:
    # Determines the color of the boss bar.
    # The value can be one of the predefined colors, for example:
    # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    #
    # Определяет цвет босс-бара.
    # Значение может быть одним из предопределенных цветов, например:
    # PINK (розовый), BLUE (синий), RED (красный), GREEN (зеленый),
    # YELLOW (желтый), PURPLE (пурпурный), WHITE (белый)
    Boss-Bar-Color: RED
    # Determines the style of the boss bar.
    # The value can be one of the predefined styles, for example:
    # SOLID (solid) means that the boss's health progress will be displayed
    # as a continuous bar or filled color.
    # SEGMENTED_6 (segmented with 6 segments) means that
    # the health progress will be divided into 6 equal segments,
    # and each segment will be displayed separately.
    # SEGMENTED_10 (segmented with 10 segments) works similarly,
    # but with 10 segments instead of 6.
    # SEGMENTED_12 (segmented with 12 segments) displays the boss's health progress with 12 segments.
    # SEGMENTED_20 (segmented with 20 segments) uses 20 segments
    # to display the boss's health progress.
    #
    # Определяет стиль босс-бара.
    # Значение может быть одним из предопределенных стилей, например:
    # SOLID (твердый) означает, что прогресс здоровья босса будет отображаться
    # как непрерывная полоса или заполненный цвет.
    # SEGMENTED_6 (сегментированный с 6 сегментами) означает,
    # что прогресс здоровья будет разбит на 6 равных сегментов,
    # и каждый сегмент будет отображаться отдельно.
    # SEGMENTED_10 (сегментированный с 10 сегментами) работает аналогично,
    # но с 10 сегментами вместо 6.
    # SEGMENTED_12 (сегментированный с 12 сегментами) отображает прогресс здоровья босса с 12 сегментами.
    # SEGMENTED_20 (сегментированный с 20 сегментами) использует 20 сегментов
    # для отображения прогресса здоровья босса.
    Boss-Bar-Style: SOLID
  BossBar:
    # Should the boss bar be enabled for the player at the start of the inspection?
    # Нужно ли включать босс-бар игроку при начале проверки?
    Enabled: true
    # Determines the color of the boss bar.
    # The value can be one of the predefined colors, for example:
    # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    #
    # Определяет цвет босс-бара.
    # Значение может быть одним из предопределенных цветов, например:
    # PINK (розовый), BLUE (синий), RED (красный), GREEN (зеленый),
    # YELLOW (желтый), PURPLE (пурпурный), WHITE (белый)
    Boss-Bar-Color: RED
    # Determines the style of the boss bar.
    # The value can be one of the predefined styles, for example:
    # SOLID (solid) means that the boss's health progress will be displayed
    # as a continuous bar or filled color.
    # SEGMENTED_6 (segmented with 6 segments) means that
    # the health progress will be divided into 6 equal segments,
    # and each segment will be displayed separately.
    # SEGMENTED_10 (segmented with 10 segments) works similarly,
    # but with 10 segments instead of 6.
    # SEGMENTED_12 (segmented with 12 segments) displays the boss's health progress with 12 segments.
    # SEGMENTED_20 (segmented with 20 segments) uses 20 segments
    # to display the boss's health progress.
    #
    # Определяет стиль босс-бара.
    # Значение может быть одним из предопределенных стилей, например:
    # SOLID (твердый) означает, что прогресс здоровья босса будет отображаться
    # как непрерывная полоса или заполненный цвет.
    # SEGMENTED_6 (сегментированный с 6 сегментами) означает,
    # что прогресс здоровья будет разбит на 6 равных сегментов,
    # и каждый сегмент будет отображаться отдельно.
    # SEGMENTED_10 (сегментированный с 10 сегментами) работает аналогично,
    # но с 10 сегментами вместо 6.
    # SEGMENTED_12 (сегментированный с 12 сегментами) отображает прогресс здоровья босса с 12 сегментами.
    # SEGMENTED_20 (сегментированный с 20 сегментами) использует 20 сегментов
    # для отображения прогресса здоровья босса.
    Boss-Bar-Style: SOLID
  BossBar-Sender:
    # Needless to say about the boss-bar for the first time?
    # Нужно ли включать босс-бар для проверяющего при начале проверки?
    Enabled: true
    # Determines the color of the boss bar.
    # The value can be one of the predefined colors, for example:
    # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    #
    # Определяет цвет босс-бара.
    # Значение может быть одним из предопределенных цветов, например:
    # PINK (розовый), BLUE (синий), RED (красный), GREEN (зеленый),
    # YELLOW (желтый), PURPLE (пурпурный), WHITE (белый)
    Boss-Bar-Sender-Color: YELLOW
    # Determines the style of the boss bar.
    # The value can be one of the predefined styles, for example:
    # SOLID (solid) means that the boss's health progress will be displayed
    # as a continuous bar or filled color.
    # SEGMENTED_6 (segmented with 6 segments) means that
    # the health progress will be divided into 6 equal segments,
    # and each segment will be displayed separately.
    # SEGMENTED_10 (segmented with 10 segments) works similarly,
    # but with 10 segments instead of 6.
    # SEGMENTED_12 (segmented with 12 segments) displays the boss's health progress with 12 segments.
    # SEGMENTED_20 (segmented with 20 segments) uses 20 segments
    # to display the boss's health progress.
    #
    # Определяет стиль босс-бара.
    # Значение может быть одним из предопределенных стилей, например:
    # SOLID (твердый) означает, что прогресс здоровья босса будет отображаться
    # как непрерывная полоса или заполненный цвет.
    # SEGMENTED_6 (сегментированный с 6 сегментами) означает,
    # что прогресс здоровья будет разбит на 6 равных сегментов,
    # и каждый сегмент будет отображаться отдельно.
