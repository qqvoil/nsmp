  Allowed-Commands:
    # Should the list of allowed commands be enabled?
    # Нужно ли, включать список разрешенных команд?
    # If you do not want to block all commands, go to the Listeners.yml file and set Player-Command-Preprocess-Enabled: false
    # Если вы не хотите блокировать все команды зайдите в файл Listeners.yml и поставьте Player-Command-Preprocess-Enabled: false
    Enabled: true
    # Specify the list of commands that are allowed during inspection.
    # Укажите здесь список команд которые будут разрешены во время проверки.
    # Grant the scheckplayer.bypassblockingcommandstarget right to the player if you want
    # so that the player can write commands without being blocked.
    # Выдайте право scheckplayer.bypassblockingcommandstarget игроку если хотите
    # чтобы игрок мог писать команды без блокировки.
    Commands:
    - /scheck confess
    # Enables or disables display of commands to the initiator that the player writes during verification.
    # Включает или отключает показ команд инициатору которые пишет игрок на проверке.
    Shows-Commands-Initiator: false
    # List of commands that will not be visible to the initiator that the player writes.
    # Список команд которые не будут видны инициатору который пишет игрок.
    # Specify "1: /(command) to not show the command if it is written with arguments /login 123"
    # Specify "0: /(command) to not show the main command, but it will show the arguments of the command /login 123"
    # Укажите "1: /(команда) чтобы не показывать команду если она написана с аргументами /login 123"
    # Укажите "0: /(команда) чтобы не показывать основную команду, но она будет показывать аргументы команды /login 123"
    Blocked-Shows-Commands-Initiator:
    - '1: /l'
    - '1: /login'
    - '1: /reg'
    - '1: /register'
    - '0: /spawn'
  Allowed-Commands-Initiator:
    # Should the list of allowed commands be enabled?
    # Включает или отключает список разрешенных команд для инициатора.
    # Если включено блокируються все команды для инициатора кроме тех что в списке.
    # Если отключено команды не будут блокироваться для инициатора.
    Enabled: false
    # Grant the scheckplayer.bypassblockingcommandsinitiator right to the initiator if you want
    # the initiator to be able to write commands without being blocked.
    # Выдайте право scheckplayer.bypassblockingcommandsinitiator инициатору если хотите
    # чтобы инициатор мог писать команды без блокировки.
    Commands:
    - /scheck confirm
    - /scheck stop
    - /scheck list
    - /scheck timer add
    - /scheck timer continue
    - /scheck timer stop
    - /scheck timer set
  Click-Messages-Target-Start-Check:
    # Should clickable messages be enabled when a player is summoned for inspection?
    # Нужно ли включать кликабельное сообщения, когда у игрока появляется проверка?
    Enabled: true
    # Should hover text be enabled?
    # Нужно ли включать ховер текст?
    Enabled-Hover-Text: true
    # Command executed when clicking on the messages.
    # Команда, выполняемая при клике на сообщения.
    Click-Command: /scheck confess
  Click-Messages-Command-Run-Remove-Afk:
    # Command executed when clicking on messages to remove a player from AFK checking.
    # Команда, выполняемая при клике на сообщения чтобы удалить игрока из афк проверки.
    Click-Command: /scheck afk %target-player% --remove
  Notify-Message-Admin:
    # Enables or disables messages to online admins.
    # Включает или отключает сообщения онлайн админам.
    Enabled: false
    # Enables or disables console messages.
    # Включает или отключает сообщения в консоль.
    Notify-Message-Console: true
  WhiteList-Players:
    # Should I include a whitelist of players who cannot be called for review?
    # Нужно ли включать белый список игроков, которых нельзя вызвать на проверку?
    Enabled: false
    # Specify a list of players.
    # Укажите список игроков.
    Players:
    - Snon_SS
  Quit-Server:
    # Enables or disables killing a player when the player leaves the check.
    # Включает или отключает убийство игрока когда игрок покинул проверку.
    Kill-Player-Quit: false
    # Allow teleporting the target player back to their original location
    # After the reviewer exits the server.
    # Разрешить телепортацию целевого игрока обратно на исходное местоположение
    # После выходе проверяющего из сервера.
    Allow-Teleport-Back-Target-Player: true
  Freezing-Player:
    # Enables or disables freezing the player at the start of the check.
    # (Works from 1.17 and higher!)
    # Включает или отключает заморозку игрока при начале проверки.
    # (Работает от 1.17 и выше!)
    Enabled: false
  Add-Tab-Completion-Afk-Remove:
    # Enables or disables the display of the command in tab completion
    # for removing AFK status. /scheck afk (nickname) --remove.
    # Включает или отключает показ команды в автозаполнении
    # табуляции для удаления режима AFK. /scheck afk (ник) --remove.
    Enabled: false
  Completion-Player-Names:
    # Specifies the maximum number of player names that will appear in the tab completion list.
    # This limit helps prevent the list from being overloaded with too many suggestions.
    #
    # Указывает максимальное количество имен игроков, которые будут отображаться в списке автозавершения.
    # Это ограничение помогает избежать перегрузки списка большим количеством предложений.
    Max-Player-Suggestions: 10
    # Enables or disables the use of a cooldown between tab completion requests by the same player.
    # When enabled (true), the system applies the delay specified in Tab-Completion-Cooldown
    # to prevent excessively frequent use of tab completion.
    # When disabled (false), no delay will be applied, and tab completion can be used without restrictions.
    # It is not recommended to set this to false, as it may lead to excessive server load
    # due to frequent tab completion requests.
    #
    # Включает или отключает использование задержки между вызовами автозавершения таба для одного и того же игрока.
    # Когда включено (true), система применяет задержку, указанную в Tab-Completion-Cooldown,
    # чтобы избежать слишком частого использования автозавершения.
    # Когда отключено (false), задержка не будет применяться, и автозавершение можно использовать без ограничений.
    # Не рекомендуется устанавливать значение false, так как это может привести к чрезмерной нагрузке на сервер
    # из-за частых запросов на автозавершение.
    Tab-Completion-Cooldown-Enabled: true
    # Specifies the cooldown in milliseconds between tab completion requests by the same player.
    # This setting helps prevent excessive use of resource-intensive operations, such as player list queries,
    # and reduces server load, especially with frequent use of tab completion commands.
    #
    # Указывает задержку в миллисекундах между вызовами автозавершения таба для одного и того же игрока.
    # Этот параметр помогает предотвратить чрезмерное использование ресурсоемких операций, таких как запросы к списку игроков,
    # и уменьшает нагрузку на сервер, особенно при частом использовании команд автозавершения.
    Tab-Completion-Cooldown: 300
  Give-Fly-On-Start:
    # Enables or disables issuing a flight to the player when the check starts.
    # Включает или отключает выдачу полета игроку при старте проверки.
    Enabled: true
