      - ''
      - '&7Цена: &b10000 токенов'
      - ''
      - '&e▶ Нажмите для покупки'
    left_click_commands:
      - '[console] p take %player_name% 10000'
      - '[console] lp user %player_name% parent addtemp vip 30d'
      - '[message] &aВы успешно приобрели статус &b&lVIP&a на 30 дней за &b10000 токенов!'
      - '[broadcast] &b&l%player_name% &aтолько что купил статус &b&lVIP&a в магазине!'
    left_click_requirement:
      requirements:
        has_tokens:
          type: javascript
          expression: '%playerpoints_points% >= 10000'
          deny_commands:
            - '[message] &cУ вас недостаточно токенов! Нужно &b10000'

  'prev_page':
