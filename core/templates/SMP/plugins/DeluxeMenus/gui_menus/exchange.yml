menu_title: '&#aa00aa&lОбменник валюты'
open_command: exchange
size: 27

items:
  # --- СЕРЫЕ СТЕКЛЯННЫЕ ПАНЕЛИ НА ФОН ---
  'gray_background':
    material: GRAY_STAINED_GLASS_PANE
    slots:
      - 0-10
      - 12-14
      - 16-21
      - 23-26
    display_name: ' '

  # --- ИЗУМРУД (Слот 11): Обмен 1000 монет на 10 токенов ---
  'exchange_to_tokens':
    material: EMERALD
    slot: 11
    display_name: '&#00ff7f&lОбмен Монет на Токены'
    lore:
      - ''
      - '&7Отдаёте: &e1,000 монет'
      - '&7Получаете: &b10 токенов'
      - ''
      - '&e▶ Кликни, чтобы обменять'
    click_commands:
      - '[console] eco take %player_name% 1000'
      - '[console] p give %player_name% 10'
      - '[message] &aВы успешно обменяли &e1000 монет &aна &b10 токенов&a!'
    click_requirement:
      requirements:
        money_check:
          type: has money
          amount: 1000
          deny_commands:
            - '[message] &cУ вас недостаточно монет! Нужно минимум 1000.'

  # --- ЗОЛОТОЙ СЛИТОК (Слот 15): Обмен 10 токенов на 1000 монет ---
  'exchange_to_money':
    material: GOLD_INGOT
    slot: 15
    display_name: '&#ffaa00&lОбмен Токенов на Монеты'
    lore:
      - ''
      - '&7Отдаёте: &b10 токенов'
      - '&7Получаете: &e1,000 монет'
      - ''
      - '&e▶ Кликни, чтобы обменять'
    click_commands:
      - '[console] p take %player_name% 10'
      - '[console] eco give %player_name% 1000'
      - '[message] &aВы успешно обменяли &b10 токенов &aна &e1,000 монет&a!'
    # НАДЁЖНАЯ ПРОВЕРКА НА НАЛИЧИЕ ТОКЕНОВ:
    click_requirement:
      requirements:
        tokens_check:
          type: javascript
          expression: '%playerpoints_points% >= 10'
          deny_commands:
            - '[message] &cУ вас недостаточно токенов! Нужно минимум 10.'

  # --- СТРЕЛА НАЗАД ---
  'back_to_coinshop':
    material: ARROW
    slot: 22
    display_name: '&c&lВернуться в магазин'
    click_commands:
      - '[openmenu] coinshop'