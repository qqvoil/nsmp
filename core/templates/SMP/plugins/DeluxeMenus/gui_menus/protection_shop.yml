  'iron_block':
    material: IRON_BLOCK
    slot: 19
    display_name: '&fЖелезный приват'
    lore:
      - '&7Размер: &f2x2x2 блока'
      - ''
      - '&7ЛКМ: &e500 монет'
      - '&7ПКМ: &b100 токенов'
    left_click_requirement:
      requirements:
        money_check:
          type: has money
          amount: 500
          deny_commands:
            - '[message] &cНедостаточно монет!'
    left_click_commands:
      - '[console] eco take %player_name% 500'
      - '[console] ps give iron_block %player_name% 1'
      - '[message] &aВы купили железный приват!'
    right_click_requirement:
      requirements:
        points_check:
          type: '>= '
          input: '%playerpoints_points%'
          value: 100
          deny_commands:
            - '[message] &cНедостаточно токенов!'
    right_click_commands:
      - '[console] points take %player_name% 100'
