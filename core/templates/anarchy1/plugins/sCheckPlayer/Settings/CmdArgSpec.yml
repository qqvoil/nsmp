#

# Setting up the /scheck spec command (player tracking).
# Настройка команды /scheck spec (слежка за игроком)
Command-Arg-Spec:
  # You can disable the "spec" command argument
  # by setting the value to false, and to enable it - true.
  # Вы можете отключить аргумент команды "spec"
  # Установив значения false, а чтобы включить - true
  Command-Arg-Spec-Enabled: true
  Spec:
    # Height offset for the observer (relative to the target player).
    # The value is specified in blocks. For example, if the value is 2, the observer will be 2 blocks higher than the target player.
    # Смещение по высоте для наблюдателя (относительно целевого игрока)
    # Значение указано в блоках. Например, если значение 2, то наблюдатель будет находиться на 2 блока выше целевого игрока.
    Height-Offset: 2
    # Minimum interpolation factor (Lerp), defining the movement speed.
    # Lerp (or linear interpolation) is used for smooth movement of the observer.
    # This parameter sets the minimum factor, ensuring the observer will not move faster than this value.
    # For example, if set to 0.2, the observer will move no faster than this speed.
    #
    # Минимальный коэффициент интерполяции (Lerp), определяющий скорость перемещения
    # Lerp (или линейная интерполяция) используется для плавного движения наблюдателя.
    # Этот параметр задает минимальный коэффициент, который гарантирует, что наблюдатель будет двигаться не быстрее определенного минимума.
    # Например, если значение 0.2, то наблюдатель будет двигаться не быстрее этой скорости.
    Lerp-Factor-Min: 0.2
    # Base interpolation factor used to calculate Lerp.
    # This is the base factor that affects the speed calculation.
    # It is added to the distance and its sum is used to determine the speed.
    # Usually, it stays low to prevent movement from being too fast.
    #
    # Базовый коэффициент интерполяции, который используется для расчета Lerp
    # Это базовый коэффициент, который влияет на расчет скорости движения наблюдателя.
    # Он добавляется к расстоянию, и его сумма используется для определения скорости.
    # Обычно он остается на низком уровне, чтобы движение не было слишком быстрым.
    Lerp-Factor-Base: 0.05
    # Multiplier used for calculating Lerp based on distance.
    # This multiplier multiplies the interpolation factor by the distance between the observer and the target player.
    # The larger the distance, the faster the observer will move to catch up with the target player.
    # A smaller value makes movement slower, even at large distances.
    #
    # Множитель, который используется для расчета Lerp в зависимости от расстояния
    # Этот множитель умножает коэффициент интерполяции на расстояние между наблюдателем и целевым игроком.
    # Чем больше расстояние, тем быстрее будет двигаться наблюдатель, чтобы догнать целевого игрока.
    # Меньшее значение делает движение медленным даже на больших расстояниях.
    Lerp-Factor-Distance-Multiplier: 0.05
    # Task interval (in ticks) for smooth following.
    # If set to 1, updates will happen every tick.
    # Интервал выполнения задачи (в тиках) для плавного следования
    # Если установлено значение 1, обновление будет происходить каждый тик.
    Task-Interval: 1
    # If true, the observer's camera will follow the player’s mouse rotation (rotate with the player).
    # If false, the observer's camera will remain fixed.
    # Если true, то камера наблюдатель будет следовать за поворотом камеры игрока (поворачиваться вместе с ним).
    # Если false, то камера наблюдатель не будет поворачиваться и будет фиксированной.
    Follow-Player-Mouse-Rotation: false
    # it's best not to modify them.
    # Лучше не изменять.
    Yaw-Adjustment: 0.1
    Pitch-Adjustment: 0.1
    # Enables or disables the observer's offset behind the target player.
    # Включает или отключает смещение наблюдателя за спину цели.
    Back-Offset-Enabled: true
    # Distance (in blocks) the observer will be positioned behind the target player.
    # Only works if Back-Offset-Enabled: true.
    # Расстояние (в блоках), на которое наблюдатель будет смещён назад от игрока-цели.
    # Работает только если Back-Offset-Enabled: true.
    Back-Offset-Distance: 2.0
  Teleport:
    # Allow teleportation of the spectator back to the initiator’s original location.
    # Разрешить телепортацию инициатора слежки обратно на исходное местоположение
    Allow-Teleport-Back-Initiator-Spectator: true
  WhiteList-Players:
    # Should I enable a whitelist of players that cannot be followed?
    # Нужно ли включать белый список игроков, за которыми нельзя следить?
    Enabled: false
    # Specify a list of players.
    # Укажите список игроков.
    Players:
    - Snon_SS
