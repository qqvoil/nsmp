de:
  Chat-Initiator-Logs-File:
    Description:
    - '%initiator-player% schrieb:'
    - '%message%'
    - 'Zeit: %time%'
    - ''
  Chat-Player-Logs-File:
    Description:
    - '%target-player% schrieb:'
    - '%message%'
    - 'Zeit: %time%'
    - ''
  Cmd-Arg-Confess-Logs-File:
    Description:
    - '%target-player% hat die Verwendung von Cheats gestanden.'
    - 'Zeit: %time%'
    - 'Überprüfungsdauer: %duration%'
    - ''
  Cmd-Arg-Confirm-Logs-File:
    Description:
    - 'Spieler, der %initiator-player% bestätigt hat: %target-player%'
    - 'Überprüfungsdauer: %duration%'
    - 'Zeit: %time%'
    - ''
  Cmd-Arg-KnockBack-Logs-File:
    Description:
    - '%initiator-player% überprüft %target-player% auf Anti-Knockback.'
    - 'Zeit: %time%'
    - ''
  Cmd-Arg-Spec-Logs-File:
    Description:
    - '%initiator-player% beobachtet nun %target-player%'
    - 'Zeit: %time%'
    - ''
  Cmd-Arg-Start-Logs-File:
    Description:
    - 'Überprüfung gestartet von: %initiator-player%'
    - 'Überprüfter Spieler: %target-player%'
    - 'Zeit: %time%'
    - ''
  Cmd-Arg-StopAll-Logs-File:
    Description:
    - '%initiator-player% hat die Überprüfung für alle Spieler gestoppt.'
    - 'Anzahl der Spieler: %amount%'
    - 'Zeit: %time%'
    - ''
  Cmd-Arg-Stop-Logs-File:
    Description:
    - 'Für unschuldig erklärt von: %initiator-player%'
    - 'Unschuldiger Spieler: %target-player%'
    - 'Zeit: %time%'
    - 'Überprüfungsdauer: %duration%'
    - ''
  Cmd-Arg-Timer-Add-Logs-File:
    Description:
    - '%initiator-player% hat den Timer für %target-player% verlängert'
    - 'Zeit: %time%'
    - ''
  Cmd-Arg-Timer-Continue-Logs-File:
    Description:
    - '%initiator-player% hat den Timer für %target-player% fortgesetzt'
    - 'Zeit: %time%'
    - ''
  Cmd-Arg-Timer-Set-Logs-File:
    Description:
    - '%initiator-player% hat den Timer für %target-player% gesetzt'
    - 'Zeit: %time%'
    - ''
  Cmd-Arg-Timer-Stop-Logs-File:
    Description:
    - '%initiator-player% hat den Timer für %target-player% gestoppt'
    - 'Zeit: %time%'
    - ''
  Target-Quit-Server-Logs-File:
    Description:
    - '%target-player% hat den Server während der Überprüfung verlassen.'
    - 'Zeit: %time%'
    - 'Überprüfungsdauer: %duration%'
    - ''
  Cmd-Arg-Brand-Logs-File:
    Description:
    - Client-Daten für %target-player%
    - 'Client-Typ: %brand%'
    - 'Moderator: %initiator-player%'
    - 'Zeit: %time%'
    - ''
en:
  Chat-Initiator-Logs-File:
    Description:
    - '%initiator-player% wrote:'
    - '%message%'
    - 'Time: %time%'
    - ''
  Chat-Player-Logs-File:
    Description:
    - '%target-player% wrote:'
    - '%message%'
    - 'Time: %time%'
    - ''
  Cmd-Arg-Confess-Logs-File:
    Description:
    - '%target-player% confessed to using cheats.'
    - 'Time: %time%'
    - 'Duration: %duration%'
    - ''
  Cmd-Arg-Confirm-Logs-File:
    Description:
    - 'Player who confirmed %initiator-player%: %target-player%'
    - 'Duration: %duration%'
    - 'Time: %time%'
    - ''
  Cmd-Arg-KnockBack-Logs-File:
    Description:
