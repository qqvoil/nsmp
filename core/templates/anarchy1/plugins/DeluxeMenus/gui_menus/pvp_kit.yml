    display_name: '&aКупить Кит PVP'
    lore:
      - '&7Цена: &b5000 токенов'
      - ''
      - '&e▶ Нажмите для покупки'
    left_click_requirement:
      requirements:
        has_tokens:
          type: javascript
          expression: '%playerpoints_points% >= 5000'
          deny_commands:
            - '[message] &cУ вас недостаточно токенов'
        has_space:
          type: has empty slots
          amount: 20
          deny_commands:
            - '[message] &cОсвободите инвентарь! Вам нужно минимум 20 свободных слотов.'
    left_click_commands:
      - '[console] p take %player_name% 5000'
      - '[console] kit pvp %player_name%'
      - '[message] &aВы успешно купили Кит PVP!'
      - '[close]'

