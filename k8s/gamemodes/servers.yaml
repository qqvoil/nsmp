# Template Helper for NeverSMP Game Servers
{{- /* Game servers are provisioned as individual StatefulSets with dedicated PVCs and DNS services */ -}}

---
# 1. Limbo (Auth Holding World)
apiVersion: v1
kind: Service
metadata:
  name: limbo
  namespace: neversmp
spec:
  ports:
    - port: 25565
      name: mc
  clusterIP: None
  selector:
    app: limbo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: limbo
  namespace: neversmp
spec:
  serviceName: limbo
  replicas: 1
  selector:
    matchLabels:
      app: limbo
  template:
    metadata:
      labels:
        app: limbo
    spec:
      containers:
        - name: limbo
          image: itzg/minecraft-server:latest
          env:
            - name: TYPE
              value: "CUSTOM"
            - name: MEMORY
              value: "256M"
            - name: EULA
              value: "TRUE"
          ports:
            - containerPort: 25565
              name: mc
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

---
# 2. Lobby (Hub Server)
apiVersion: v1
kind: Service
metadata:
  name: lobby
  namespace: neversmp
spec:
  ports:
    - port: 25565
      name: mc
    - port: 25575
      name: rcon
  clusterIP: None
  selector:
    app: lobby
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lobby
  namespace: neversmp
spec:
  serviceName: lobby
  replicas: 1
  selector:
    matchLabels:
      app: lobby
  template:
    metadata:
      labels:
        app: lobby
    spec:
      containers:
        - name: lobby
          image: itzg/minecraft-server:latest
          env:
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "1.21.4"
            - name: MEMORY
              value: "2G"
            - name: EULA
              value: "TRUE"
            - name: RCON_ENABLED
              value: "true"
            - name: RCON_PASSWORD
              value: "YOUR_RCON_PASSWORD"
            - name: ONLINE_MODE
              value: "FALSE"
          ports:
            - containerPort: 25565
              name: mc
            - containerPort: 25575
              name: rcon
          resources:
            requests:
              memory: "1.5Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

